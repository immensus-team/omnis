name: ci

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: path filter
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A7-D7: integration job은 이 경로가 바뀔 때만 돈다.
          filters: |
            backend:
              - 'packages/db/**'
              - 'packages/kernel/**'
              - 'packages/memory/**'
              - 'apps/hub/**'
              - 'vitest.workspace.ts'
              - 'vitest.shared.ts'
              - 'vitest.global-setup.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  check:
    name: lint + typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # 컨테이너 없이 도는 unit + contract 프로젝트만(계약 §2). integration은 아래 job이 맡는다.
      # `--`가 필수다 — 없으면 pnpm이 --project를 자기 옵션으로 읽고 Unknown option으로 죽는다.
      - run: pnpm test -- --project unit --project contract

  integration:
    name: integration (postgres 17 + pgvector)
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        # pgvector/pgvector:pg17 = 공식 postgres:17 + vector 확장. pgcrypto/pg_trgm은 contrib로 이미 들어 있다.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: logan
          POSTGRES_PASSWORD: logan
          POSTGRES_DB: omnis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logan -d omnis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # vitest.global-setup.ts는 URL에 omnis_test가 없으면 스키마를 지우지 않고 거부한다.
      DATABASE_URL: postgres://logan:logan@127.0.0.1:5432/omnis_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
