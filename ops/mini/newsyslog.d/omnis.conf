# US-B42: keep omnis logs for 30 days, mode 600 (the one-JSON-line log convention keeps secret values out of the
# keys, but as a second layer of defense only the vigor account may read the files themselves). logfilename [owner:group] mode count size(K) when flags
/Users/vigor/Library/Logs/omnis/*.log        vigor:staff  600  30  *  $D0  J
/Users/vigor/Library/Logs/omnis/*.err.log    vigor:staff  600  30  *  $D0  J
