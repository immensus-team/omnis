[package]
name = "omnis-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "omnis-desktop"
path = "src/main.rs"
