# omnis Slack app manifest — api.slack.com/apps → "Create New App" → "From an app manifest".
# Contains only the scopes A1 §2.1 requires: Socket Mode + message.im/channels/groups/mpim events +
# bot(xoxb)/user(xoxp) scopes. After deployment, store the three tokens xoxb/xoxp/app-level in Keychain (README.ko.md).
display_information:
  name: omnis
  description: Logan's personal inbox/agent bridge (omnis project)
  background_color: "#1a1a1a"
features:
  bot_user:
    display_name: omnis
    always_online: true
oauth_config:
  scopes:
    # A1 §2.1: bot(xoxb) — read + send + read reactions
    bot:
      - channels:history
      - im:history
      - groups:history
      - mpim:history
      - chat:write
      - reactions:read
    # A1 §2.1: user(xoxp) — search + send as a real person
    user:
      - search:read
      - channels:history
      - chat:write
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - message.channels
      - message.groups
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
